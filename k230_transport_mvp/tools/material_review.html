<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K230 · 顶面数据核对</title><style>
:root{--bg:#111a16;--panel:#1d2a23;--paper:#f0f1e7;--ink:#24382d;--line:#405247;--accent:#d7ed85;--muted:#9aac9e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:"Microsoft YaHei UI","Noto Sans CJK SC",sans-serif;font-size:14px}header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px}h1{font-family:"Noto Serif CJK SC",SimSun,serif;font-weight:500;font-size:25px;margin:0}header small{color:var(--muted)}.badge{margin-left:auto;color:var(--accent);border:1px solid var(--line);padding:8px 12px;font:12px Consolas,monospace}main{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 84px)}aside{padding:18px;border-right:1px solid var(--line)}#frames{display:grid;gap:7px}.frame{padding:11px;text-align:left;background:transparent;color:var(--paper);border:1px solid var(--line);cursor:pointer}.frame.active{border-color:var(--accent);background:#35412b}.frame span{display:block;font:12px Consolas,monospace;color:var(--muted);margin-top:5px}section{padding:22px 28px;max-width:1100px}.guide{line-height:1.8;color:#c0cbbf;margin:0 0 16px}.canvas-wrap{background:#090f0c;border:1px solid var(--line);padding:12px}canvas{display:block;width:100%;max-width:960px;height:auto;touch-action:none;cursor:crosshair}#identity{font:12px Consolas,monospace;color:var(--muted);margin:10px 0 18px;overflow-wrap:anywhere}.controls{background:var(--paper);color:var(--ink);padding:18px;display:grid;gap:14px}.fields{display:grid;grid-template-columns:1fr 1fr 130px;gap:12px}label{display:block;font-size:12px;line-height:1.6}input,select,button{font:inherit}input[type=text],input[type=number],select{width:100%;padding:8px;border:1px solid #b6c0af;background:#fff;color:var(--ink)}input[type=checkbox]{margin-right:7px}.check{font-size:13px}button{padding:9px 13px;border:1px solid var(--line);cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #97b845;outline-offset:2px}.actions{display:flex;gap:9px;flex-wrap:wrap}.primary{background:#2d4a37;color:#fff}.quiet{background:transparent;color:var(--ink)}#objects{display:grid;gap:7px}.object{display:grid;grid-template-columns:26px 100px repeat(4,minmax(55px,1fr)) 84px 45px;gap:7px;align-items:center;font-size:12px}.object.selected{outline:2px solid #8eaa41;outline-offset:3px}#message{min-height:22px;font-size:13px;color:#36592e}.note{font-size:12px;line-height:1.7;color:#5b6b5b}.legend{color:var(--accent);font-size:12px;margin:0 0 12px}@media(max-width:850px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}#frames{display:flex;overflow:auto}.frame{min-width:125px}section{padding:16px}.fields{grid-template-columns:1fr}.object{grid-template-columns:24px 80px repeat(4,52px) 75px 40px;overflow:auto}header{padding:16px;flex-wrap:wrap}.badge{margin-left:0}}
</style><header><div><h1>最终物块 · 顶面数据核对</h1><small>采集 → 草稿 → 人工核对 → 分组校验 → 训练</small></div><div class="badge" id="progress">尚无人审</div></header>
<main><aside><p class="legend">原图列表 / SOURCE FRAMES</p><div id="frames"></div><p class="guide" style="font-size:12px;margin-top:18px">本页离线使用。保存的是审阅JSON，不会连接开发板或启动训练。</p></aside><section>
<p class="guide">只框住实际可见的<strong>物块顶面</strong>，纸靶不标。拖动空处新增框，拖框移动，拖右下角调整大小；也可用数值精调。这里是训练标注框，实时识别画面仍使用圆／椭圆。</p>
<div class="canvas-wrap"><canvas id="view" width="640" height="360" aria-label="640乘360原图顶面标注"></canvas></div><div id="identity"></div>
<div class="controls"><div class="fields"><label>核对人<input id="reviewer" type="text" placeholder="填写实际核对人"></label><label>实际采集场景组<input id="group" type="text" placeholder="不确定就留空，不按图片随意分组"></label><label>数据用途<select id="split"><option value="">暂不划分</option><option value="train">训练</option><option value="val">验证</option><option value="test">盲测</option></select></label></div>
<label class="check"><input id="groupChecked" type="checkbox">我已确认此图的实际采集场景组；同一短批次不得拆到训练与测试</label>
<div id="objects"></div><label class="check"><input id="allChecked" type="checkbox">我逐一核对了所有可见顶面，已修正／补齐框；空图也已完整检查</label>
<div class="actions"><button class="primary" id="approve">通过本帧标注</button><button class="quiet" id="exclude">排除本帧</button><button class="quiet" id="clear">清空本帧框</button><button class="quiet" id="export">保存进度JSON</button></div><div id="message" role="status"></div>
<div class="note">辅助草稿没有人工真值效力。黑色顶面边界不清、截断或超过3块的难例可排除；不能漏掉一个不确定物块后当作空背景。场景分组和盲测划分仍需真实采集记录，代码导出门会再次检查。</div></div></section></main>
<script>
const DATA=/*__REVIEW_PAYLOAD__*/;
const $=id=>document.getElementById(id), colors=['#9ba496','#ff5252','#e4c62b','#5e88ff','#4aa968','#f5f5f5','#35d9da'],names=['未确定','红','黄','蓝','绿','黑','浅蓝'];
let state=structuredClone(DATA.manifest),current=0,selected=-1,drag=null,picture=new Image();
const key='k230-material-review-'+DATA.manifest_sha256;
for(const record of state.images){const item=DATA.images.find(x=>x.image_id===record.image_id);if(record.review.objects===null)record.review.objects=structuredClone(item.draft_objects);}
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.source_hash===DATA.manifest_sha256)state=saved.manifest;}catch{}
const record=()=>state.images[current];const objects=()=>record().review.objects||[];
function message(text){$('message').textContent=text;}
function store(){try{localStorage.setItem(key,JSON.stringify({source_hash:DATA.manifest_sha256,manifest:state}));}catch{message('浏览器暂存不可用，请及时保存进度JSON。');}}
function formSave(){const r=record();r.scene_group_id=$('group').value.trim()||null;r.scene_group_confirmed=$('groupChecked').checked;r.split=$('split').value||null;}
function invalidate(){record().review.status='UNREVIEWED';record().review.all_visible_tops_checked=false;$('allChecked').checked=false;store();navigation();}
function navigation(){let done=0;$('frames').replaceChildren();state.images.forEach((r,i)=>{if(r.review.status==='APPROVED')done++;const b=document.createElement('button');b.className='frame'+(i===current?' active':'');b.textContent=`${String(i+1).padStart(2,'0')} · ${r.review.status==='APPROVED'?'标注通过':r.review.ignore?'已排除':'待核对'}`;const small=document.createElement('span');small.textContent=r.image_id.slice(0,10);b.append(small);b.onclick=()=>{formSave();store();current=i;selected=-1;load();};$('frames').append(b);});$('progress').textContent=`${done} / ${state.images.length} 帧标注通过`;}
function load(){const r=record();$('group').value=r.scene_group_id||'';$('groupChecked').checked=r.scene_group_confirmed===true;$('split').value=r.split||'';$('allChecked').checked=r.review.all_visible_tops_checked===true;if(r.review.reviewer)$('reviewer').value=r.review.reviewer;const series=[...new Set(r.captures.map(c=>c.capture_series_id).filter(Boolean))];$('identity').textContent=`640×360 · ${r.image_id.slice(0,16)} · ${series.length?'同批：'+series.join(', '):'历史场景组未确认'}`;picture.onload=draw;picture.src=DATA.images.find(i=>i.image_id===r.image_id).image_url;renderObjects();navigation();message('草稿需逐项核对；不确定时可排除本帧。');}
function draw(){const ctx=$('view').getContext('2d');ctx.clearRect(0,0,640,360);if(picture.complete)ctx.drawImage(picture,0,0,640,360);objects().forEach((o,i)=>{const [x,y,w,h]=o.bbox_xywh;ctx.strokeStyle=colors[o.color_id||0];ctx.lineWidth=i===selected?3:2;ctx.strokeRect(x,y,w,h);ctx.fillStyle='#14251dcc';ctx.fillRect(x,y,24,19);ctx.fillStyle='#fff';ctx.font='13px monospace';ctx.fillText(String(i+1),x+6,y+14);ctx.fillStyle=ctx.strokeStyle;ctx.fillRect(x+w-4,y+h-4,7,7);});}
function renderObjects(){$('objects').replaceChildren();objects().forEach((o,i)=>{const row=document.createElement('div');row.className='object'+(i===selected?' selected':'');const number=document.createElement('span');number.textContent=String(i+1);row.append(number);const select=document.createElement('select');names.forEach((name,j)=>{const option=new Option(name,j===0?'':String(j));select.add(option);});select.value=o.color_id?String(o.color_id):'';select.onchange=()=>{o.color_id=select.value?Number(select.value):null;invalidate();draw();};row.append(select);['x','y','宽','高'].forEach((label,j)=>{const input=document.createElement('input');input.type='number';input.step='1';input.value=o.bbox_xywh[j];input.setAttribute('aria-label',`框${i+1}${label}`);input.onchange=()=>{const value=Number(input.value);if(!Number.isFinite(value))return;o.bbox_xywh[j]=value;invalidate();draw();};row.append(input);});const uncertain=document.createElement('label');uncertain.innerHTML='<input type="checkbox">不确定';uncertain.firstChild.checked=o.uncertain===true;uncertain.firstChild.onchange=e=>{o.uncertain=e.target.checked;invalidate();};row.append(uncertain);const remove=document.createElement('button');remove.textContent='删';remove.onclick=()=>{objects().splice(i,1);selected=-1;invalidate();renderObjects();draw();};row.append(remove);$('objects').append(row);});draw();}
function point(event){const r=$('view').getBoundingClientRect();return [Math.max(0,Math.min(640,(event.clientX-r.left)*640/r.width)),Math.max(0,Math.min(360,(event.clientY-r.top)*360/r.height))];}
$('view').onpointerdown=e=>{const p=point(e);let hit=-1;for(let i=objects().length-1;i>=0;i--){const [x,y,w,h]=objects()[i].bbox_xywh;if(p[0]>=x-5&&p[0]<=x+w+5&&p[1]>=y-5&&p[1]<=y+h+5){hit=i;break;}}if(hit<0){objects().push({class_id:0,bbox_xywh:[p[0],p[1],1,1],color_id:null,uncertain:false,geometry_complete_verified:false});hit=objects().length-1;drag={mode:'new',start:p};}else{const box=objects()[hit].bbox_xywh;drag={mode:Math.abs(p[0]-box[0]-box[2])<9&&Math.abs(p[1]-box[1]-box[3])<9?'resize':'move',start:p,box:[...box]};}selected=hit;$('view').setPointerCapture(e.pointerId);invalidate();renderObjects();};
$('view').onpointermove=e=>{if(!drag)return;const p=point(e),o=objects()[selected];if(drag.mode==='new'){o.bbox_xywh=[Math.min(drag.start[0],p[0]),Math.min(drag.start[1],p[1]),Math.max(1,Math.abs(p[0]-drag.start[0])),Math.max(1,Math.abs(p[1]-drag.start[1]))];}else if(drag.mode==='move'){let [x,y,w,h]=drag.box;o.bbox_xywh=[Math.max(0,Math.min(640-w,x+p[0]-drag.start[0])),Math.max(0,Math.min(360-h,y+p[1]-drag.start[1])),w,h];}else{const [x,y]=drag.box;o.bbox_xywh=[x,y,Math.max(1,p[0]-x),Math.max(1,p[1]-y)];}draw();};
$('view').onpointerup=()=>{if(!drag)return;drag=null;renderObjects();store();};$('view').onpointercancel=()=>{drag=null;renderObjects();store();};
for(const id of ['group','split','groupChecked'])$(id).onchange=()=>{formSave();store();};
$('allChecked').onchange=()=>{if(!$('allChecked').checked&&record().review.status==='APPROVED')invalidate();};
$('clear').onclick=()=>{record().review.objects=[];selected=-1;invalidate();renderObjects();};
$('exclude').onclick=()=>{const name=$('reviewer').value.trim();if(!name){message('请填写实际核对人。');return;}formSave();record().review={status:'EXCLUDED',reviewer:name,all_visible_tops_checked:false,uncertain:true,ignore:true,source_native_sha256:record().native_sha256,objects:objects()};store();navigation();message('本帧已排除，导出门不会将它作为训练负例。');};
$('approve').onclick=()=>{const name=$('reviewer').value.trim();if(!name||!$('allChecked').checked){message('请填写核对人，并确认已完整检查所有可见顶面。');return;}if(objects().length>3||objects().some(o=>o.uncertain)){message('超过3块或仍有不确定框，请修正或排除本帧。');return;}if(objects().some(o=>o.bbox_xywh.length!==4||o.bbox_xywh.some(v=>!Number.isFinite(v))||o.bbox_xywh[0]<0||o.bbox_xywh[1]<0||o.bbox_xywh[2]<=0||o.bbox_xywh[3]<=0||o.bbox_xywh[0]+o.bbox_xywh[2]>640||o.bbox_xywh[1]+o.bbox_xywh[3]>360)){message('框必须位于640×360原图内并有正面积。');return;}formSave();record().review={status:'APPROVED',reviewer:name,all_visible_tops_checked:true,uncertain:false,source_native_sha256:record().native_sha256,objects:objects().map(o=>({class_id:0,bbox_xywh:o.bbox_xywh.map(v=>Math.round(v*100)/100),color_id:o.color_id||null,uncertain:false,truncated:!!o.truncated,geometry_complete_verified:false}))};store();renderObjects();navigation();message(record().scene_group_confirmed&&record().split?'标注已通过；训练导出仍会核对全数据分组与真值。':'标注已通过；实际场景组/数据划分待确认，暂不能训练。');};
$('export').onclick=()=>{formSave();store();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='material_reviewed_progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('已下载审阅进度JSON；没有启动训练。');};
load();
</script></html>
