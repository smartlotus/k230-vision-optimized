# Reviewable template; install at .github/workflows/topface_archive_transfer.yml
# only after the K230 publisher/temporary credential destination is authorized.
name: K230 cloud archive transfer

on:
  push:
    branches:
      - 'ops/topface-transfer-*'

permissions:
  contents: read

concurrency:
  group: topface-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transfer:
    if: github.event.repository.private && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact publisher revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: research/topface/publisher/ci_transfer.py
          sparse-checkout-cone-mode: false
      - name: Transfer and verify fixed archive
        env:
          TOPFACE_TRANSFER_SPEC: ${{ secrets[format('TOPFACE_TRANSFER_{0}', github.event.head_commit.message)] }}
        run: python3 -I -B research/topface/publisher/ci_transfer.py
